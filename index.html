<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1320">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Bushido Table Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone-first play surface; sticky turn bar on top, model cards below, cards & setup at the foot */
:root{
  --bg:#e8ebf1; --surface:#f8f9fc; --raised:#ffffff; --ink:#1a2132; --muted:#5a6377; --line:#cfd5e0;
  --accent:#9a6a14; --accent-soft:#f1e3c4; --on-accent:#ffffff;
  --harm:#b3261e; --fire:#c2540c; --poison:#2c7a2f; --ki:#3550a3; --ki-soft:#dfe5f7; --wound:#9b2c2c;
  --display:"Shippori Mincho B1", "Hiragino Mincho ProN", Georgia, serif;
  --body:"Zen Kaku Gothic New", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#171f30; --raised:#1e283c; --ink:#e8eaf0; --muted:#97a1b7; --line:#2b3550;
  --accent:#dba746; --accent-soft:#3a2f17; --on-accent:#1a1406;
  --harm:#f07164; --fire:#f39048; --poison:#71c374; --ki:#93a9ff; --ki-soft:#232f52; --wound:#f07164; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#171f30; --raised:#1e283c; --ink:#e8eaf0; --muted:#97a1b7; --line:#2b3550;
  --accent:#dba746; --accent-soft:#3a2f17; --on-accent:#1a1406;
  --harm:#f07164; --fire:#f39048; --poison:#71c374; --ki:#93a9ff; --ki-soft:#232f52; --wound:#f07164; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:12px;padding-block:0 96px;max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Turn bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;margin-inline:-12px;padding-inline:12px;border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;gap:10px}
.turn{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;white-space:nowrap}
.turn small{font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.phases{display:flex;gap:2px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.phases span{font-size:12px;padding:4px 9px;border-radius:999px;color:var(--muted);font-weight:500}
.phases span.on{background:var(--ink);color:var(--bg)}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.score{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.score b{font-size:11px;letter-spacing:.08em;color:var(--muted);padding-inline:6px 2px}
.score .v{min-width:22px;text-align:center;font-weight:700;font-size:17px}
.step{width:34px;height:34px;border-radius:8px;font-size:20px;line-height:1;display:grid;place-items:center}
.step:active{background:var(--line)}
.bar-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.next{margin-left:auto;flex:none;white-space:nowrap;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:10px;padding:9px 14px;font-size:14px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn:disabled{opacity:.35}
.icon-btn.armed{width:auto;padding:0 10px;color:var(--harm);border-color:var(--harm);font-weight:700;font-size:13px}
.icon-btn.undo-btn{width:auto;display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-weight:700;font-size:14px;color:var(--ink)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Reminders */
.reminders{display:grid;gap:6px;margin-top:12px}
.rem{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.rem p{margin:0;flex:1;min-width:0}
.rem strong{font-weight:700}
.rem .act{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;padding:2px 4px}
.ready-line{font-size:13px;color:var(--muted);margin:14px 2px 6px;display:flex;justify-content:space-between}

/* Model cards */
.models{display:grid;gap:10px}
.m{min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px}
.m.dead{opacity:.5}
.m-head{display:flex;align-items:center;gap:8px}
.m-name{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1;flex:1;min-width:0}
.m-eq{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--body);margin-top:4px}
.eq-tag{font-weight:500;font-size:13px;line-height:1.3;color:var(--accent);padding:3px 0}
.eq-tag.off{color:var(--muted);text-decoration:line-through}
.eq-off{color:var(--muted)}
.m-name small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px;border:1px solid currentColor;white-space:nowrap}
.pill.slow{color:var(--fire)}
.pill.terr{color:var(--muted)}
.pill.dead{color:var(--harm)}
.pill.ls{color:var(--harm);background:none;font:inherit;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.m.on-ls{border-color:var(--harm)}

.track{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:8px;margin-top:10px}
.track-label{white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pips{display:flex;flex-wrap:wrap;gap:5px}
.pips.rows{flex-direction:column;flex-wrap:nowrap}
.pip-row{display:flex;gap:5px}
.pip{width:24px;height:24px;border-radius:5px;border:1.5px solid var(--line);background:var(--raised);padding:0;position:relative}
.pip::after{content:"";position:absolute;inset:-5px -2px}
.w .pip.on{background:var(--wound);border-color:var(--wound)}
.k .pip{border-radius:50%}
.k .pip.on{background:var(--ki);border-color:var(--ki)}
.track-val{font-size:13px;color:var(--muted);text-align:right;min-width:48px}
.track-val b{color:var(--ink);font-size:15px}

.states{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px 5px 8px;font-size:13px;font-weight:500;background:var(--raised);border:1px solid var(--line)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip .c{font-weight:700;font-size:12px;background:var(--ink);color:var(--bg);border-radius:999px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding-inline:4px}
.chip.open{padding:2px 4px 2px 8px;gap:2px}
.chip.open .step{width:30px;height:30px}
.add-state{font-size:13px;font-weight:700;color:var(--accent);padding:6px 8px}
.cat-harm i{background:var(--harm)} .cat-fire i{background:var(--fire)} .cat-poison i{background:var(--poison)} .cat-good i{background:var(--ki)}

.feats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.feat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ki);color:var(--ki);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:500;background:var(--ki-soft)}
.feat .cost{font-weight:700}
.feat:disabled{opacity:.4;cursor:default}
.feat.used{text-decoration:line-through}
.more{font-size:12px;color:var(--muted);margin-top:8px;padding:4px 0;font-weight:500}
.detail{min-width:0;overflow-wrap:anywhere;margin-top:6px;border-top:1px solid var(--line);padding-top:10px;font-size:13.5px;display:grid;gap:10px}
.statline{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.statline div{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:5px 2px}
.statline small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.statline b{font-size:15px}
.detail h4{margin:0 0 3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.detail p{margin:0}
.wpn{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.wpn b{white-space:normal}
.wpn em{min-width:0}
.wpn em{font-style:normal;color:var(--muted)}
.eq{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:4px}

/* Opponent strip */
.opp{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.opp-head{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;text-align:left}
.opp-head b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none}
.opp-sum{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp-sum em{font-style:normal;color:var(--muted)}
.opp-vp{font-weight:700;font-size:13px;flex:none}
.opp-body{border-top:1px solid var(--line);padding:8px 12px 10px;display:grid;gap:8px}
.opp-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.opp-row .nm{font-weight:700;font-size:14px;margin-right:2px}
.opp-row .x{margin-left:auto;font-size:12px;color:var(--muted);padding:4px 6px}
.opp-row .x.confirm{color:var(--harm);font-weight:700}
.opp-add{display:flex;gap:6px}
.opp-add input{flex:1;min-width:0;font:inherit;font-size:14px;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.opp-add button{font-weight:700;color:var(--accent);padding:0 8px}
.opp-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick-list{display:grid;gap:6px}
.pick-list button{text-align:left;padding:12px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-weight:500}

.rem-acts{display:flex;gap:2px;flex:none}
.act.quiet{color:var(--muted);font-weight:500}
.rule{font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px;padding:0}
.tap-hint{font-size:12px;color:var(--muted)}
.file-btn{display:inline-block;cursor:pointer}
.paste{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.paste summary{cursor:pointer;font-weight:700;font-size:14px}
.gloss{white-space:pre-line;margin:0;font-size:14.5px;line-height:1.55}
/* Games & warbands sheet */
.list-btn{display:block;padding:0;text-align:left;cursor:pointer}
.sheet-h{margin:16px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slots{display:grid;gap:6px}
.slot{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.slot.cur{border-color:var(--accent)}
.slot-main{flex:1;min-width:0}
.slot-main b{display:block;font-size:15px}
.slot-main span{display:block;font-size:12.5px;color:var(--muted)}
.slot-tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.btn.small{padding:7px 10px;font-size:13px;white-space:nowrap}
.btn.quiet{background:none;border-color:transparent;color:var(--muted)}
.opp-add select{flex:1;min-width:0;font:inherit;font-size:14px;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px}

.sync-status{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
.sync-status::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.sync-status[data-kind="ok"]::before{background:var(--poison)}
.sync-status[data-kind="wait"]::before{background:var(--fire)}
.code-box{font:600 18px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px;user-select:all;overflow-wrap:anywhere}
.foot{flex-wrap:wrap}

/* Card section */
h2{font-family:var(--display);font-size:18px;margin:26px 2px 8px}
.cards{display:grid;gap:8px}
.card{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card-type{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card b{display:block;font-size:15px}
.card p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.card > div{flex:1;min-width:0}
.check{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card.done b{text-decoration:line-through;color:var(--muted)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,15,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.sheet h3{font-family:var(--display);font-size:20px;margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.grid-states{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.grid-states button{display:flex;align-items:center;gap:8px;text-align:left;padding:10px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-size:14px}
.grid-states button i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.grid-states button:disabled{opacity:.4}
.grid-states button small{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
textarea{width:100%;min-height:220px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border-radius:10px;padding:10px 14px;font-weight:700;border:1px solid var(--line);background:var(--raised)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--harm);border-color:var(--harm)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.foot{display:flex;gap:8px;margin-top:22px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 14px;display:flex;gap:12px;align-items:center;font-size:14px;z-index:50;width:max-content;max-width:calc(100% - 32px)}
.toast button{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:no-preference){.m,.chip,.pip{transition:background-color .15s,border-color .15s}}
@media (max-width:400px){.phases span{padding:4px 6px;font-size:11.5px}.pip{width:22px;height:22px}}

/* Tablet landscape and wider: wider page, profiles in two columns, turn bar on one line */
@media (min-width:860px){
  body{max-width:1280px;padding-inline:20px}
  .bar{margin-inline:-20px;padding-inline:20px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
  .bar-row,.bar-foot{margin-top:0}
  .bar-foot{margin-left:auto}
  .reminders{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
  .models{grid-template-columns:1fr 1fr;align-items:start}
  .cards{grid-template-columns:1fr 1fr;align-items:start}
}

/* ---------- Home and end-of-game screens ---------- */
.screen{padding-block:18px 8px}
.home-head{display:flex;align-items:flex-end;gap:12px;padding-block:8px 4px}
.home-head h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:0}
.home-head .mark{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--accent)}
.home-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:26px 2px 8px}
.sec-h h2{margin:0}
.sec-h span{font-size:12.5px;color:var(--muted)}
.slot .btn.small{min-height:36px}
.slot.res-win{border-left:3px solid var(--poison)}
.slot.res-loss{border-left:3px solid var(--harm)}
.slot.res-draw{border-left:3px solid var(--muted)}
.slot.fresh{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.import{display:grid;gap:8px;margin-top:10px}
.import .row{margin-top:0}
.empty{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);font-size:14px}
.play-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.play-actions .spacer{flex:1}
.btn.armed{border-color:var(--harm);color:var(--harm)}
/* Play screen title: home + warband name on one line, turn status on its own line below */
.turn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;white-space:normal;min-width:0}
.list-btn.home-btn{display:flex;align-items:center;min-height:40px;padding:2px 10px 2px 0;border-radius:10px;max-width:100%}
.home-btn small#listName{display:flex;align-items:center;gap:10px;margin:0;font-size:17px;font-weight:700;letter-spacing:.06em;color:var(--ink);min-width:0}
.home-btn svg{width:24px;height:24px;flex:none;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#turnLabel{display:block}
.end-hero{padding-block:10px 4px}
.end-hero small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.end-hero h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;margin:4px 0 2px}
.end-hero h1.win{color:var(--poison)}
.end-hero h1.loss{color:var(--harm)}
.end-hero p{margin:0;color:var(--muted)}
.score-line{display:flex;align-items:baseline;gap:12px;margin-top:12px;font-variant-numeric:tabular-nums}
.score-line b{font-family:var(--display);font-size:44px;line-height:1}
.score-line span{color:var(--muted);font-size:13px;display:block}
.score-line i{font-style:normal;color:var(--muted);font-size:28px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.tiles div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.tiles small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tiles b{font-size:20px;font-variant-numeric:tabular-nums}
.roster{display:grid;gap:6px}
.roster-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.roster-row b{font-size:15px}
.roster-row .st{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;align-self:center}
.roster-row .st.dead{color:var(--harm)}
.roster-row .st.up{color:var(--poison)}
.roster-row .meta{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.roster-row.is-dead b{color:var(--muted);text-decoration:line-through}
.end-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
@media (max-width:400px){.tiles{grid-template-columns:repeat(2,1fr)}}
/* ---------- Hub ---------- */
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:18px}
.hub-tile{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:120px;align-content:start}
.hub-tile b{font-family:var(--display);font-size:22px;line-height:1.1}
.hub-tile p{margin:0;color:var(--muted);font-size:14px}
.hub-tile .hub-meta{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.hub-tile:not([disabled]):hover{border-color:var(--accent)}
.hub-tile[disabled]{opacity:.55;cursor:default}

/* ---------- Table screen (laptop-first, full width) ---------- */
/* Sumi-e palette: ink on rice paper, indigo (ai) for you, vermilion (shu) for the opponent, ochre for neutral */
:root{
  --side-f:#2f4f86; --side-e:#b8392a; --side-n:#b5862a; --shu:#b8392a;
  --paper:#efe6d1; --paper-hi:#f8f2e4; --sumi:#1f1b17; --mount:#2b2621; --mount-line:#b5862a; --petal:#e2a3a8;
  --felt:transparent; --g1:rgba(31,27,23,.07); --g6:rgba(31,27,23,.2);
  --t-stone:#5d554d; --t-low:#8a8177; --t-wood:#5f6d3a; --t-water:#557d97; --t-road:#c39c5a; --t-hill:#9a7a4a;
  --paper-grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --side-f:#7f9fd6; --side-e:#e0705c; --side-n:#d6aa52; --shu:#d4604c;
  --paper:#26231e; --paper-hi:#302c26; --sumi:#e8dfcb; --mount:#0f0d0b; --mount-line:#8a6a2a; --petal:#c98a90;
  --g1:rgba(232,223,203,.06); --g6:rgba(232,223,203,.17);
  --t-stone:#a59a8c; --t-low:#7d756b; --t-wood:#7f8f55; --t-water:#5f8aa6; --t-road:#a8854a; --t-hill:#94764a;
  --paper-grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .9  0 0 0 0 .85  0 0 0 0 .75  0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}}
:root[data-theme="dark"]{
  --side-f:#7f9fd6; --side-e:#e0705c; --side-n:#d6aa52; --shu:#d4604c;
  --paper:#26231e; --paper-hi:#302c26; --sumi:#e8dfcb; --mount:#0f0d0b; --mount-line:#8a6a2a; --petal:#c98a90;
  --g1:rgba(232,223,203,.06); --g6:rgba(232,223,203,.17);
  --t-stone:#a59a8c; --t-low:#7d756b; --t-wood:#7f8f55; --t-water:#5f8aa6; --t-road:#a8854a; --t-hill:#94764a;
  --paper-grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .9  0 0 0 0 .85  0 0 0 0 .75  0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body.table-mode{max-width:none}
#tableView{padding-block:10px 0}
.thead{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding-block:4px 10px}
.thead h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;line-height:1}
.thead .spacer{flex:1}
.tgrid{display:grid;grid-template-columns:minmax(230px,280px) minmax(0,1fr) minmax(280px,340px);gap:14px;align-items:start}
.tboard{position:sticky;top:8px;min-width:0}
#tSvg{display:block;width:100%;max-height:calc(100vh - 110px);aspect-ratio:1/1;margin:0 auto;touch-action:none;user-select:none;background:var(--paper-grain),var(--paper);border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#tSvg.crosshair{cursor:crosshair}
.thint{font-size:12.5px;color:var(--muted);text-align:center;margin:6px 0 0}
.tside{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.tside>*{min-width:0;overflow-wrap:anywhere}
.tmcard .statline{grid-template-columns:repeat(5,minmax(0,1fr))}
.tside.right{max-height:calc(100vh - 80px);overflow:auto;padding-right:2px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.tcard h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tcard-h{display:grid;gap:2px;margin-bottom:8px}
.tcard-h b{font-family:var(--display);font-size:22px}
.tcard-h span{color:var(--muted);font-size:13px}
.tfacts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0 0 8px}
.tfacts dt{color:var(--muted);font-size:12.5px}
.tfacts dd{margin:0}
.tvp{margin:0;padding-left:18px;display:grid;gap:3px}
.trules{margin:8px 0 0;font-size:13px}
.tsrc{margin:8px 0 0;font-size:11.5px;color:var(--muted)}
.tsteps{margin:0;padding-left:0;list-style:none;display:grid;gap:5px;font-size:13px}
.tsteps label{display:flex;gap:6px;align-items:flex-start}
.tsteps input{margin-top:3px}
.tray{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;border-top:3px solid var(--side-f)}
.tray.E{border-top-color:var(--side-e)}
.tray-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.tray-h span{color:var(--muted);font-size:13px;text-align:right}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.trow.sel .tname{color:var(--accent)}
.trow.armed{background:var(--accent-soft);margin-inline:-6px;padding-inline:6px;border-radius:8px}
.tname{text-align:left;font-weight:700;padding:0}
.tname small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tacts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px}
.tbtn{font-size:12.5px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--raised)}
.tbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tflank{grid-column:1 / -1;font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tflank select,.tcard select,.tform select{font:inherit;font-size:13px;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 6px;max-width:100%}
.warn{color:var(--fire);font-weight:700;font-size:12px}
.okk{color:var(--poison);font-weight:700;font-size:12px}
.els{color:var(--ki);font-weight:700;font-size:12px}
.muted{color:var(--muted)}
.tsmall{font-size:12.5px}
.tinfo p{margin:4px 0}
.tfold summary{cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.tcard.tfold summary{margin:0}
.tcard.tfold[open] summary{margin-bottom:6px}
.tmcard{display:grid;gap:8px;font-size:13.5px}
.tmcard h4{margin:0 0 3px}
.tmcard p{margin:2px 0}
.tact{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.tact .tacts{margin:0;flex:1 1 100%}
.tact-dots{display:inline-flex;gap:4px}
.tact-dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);opacity:.5}
.tact-dots i.on{background:var(--ink);opacity:.9}
.tgame{display:grid;gap:8px}
.twk{display:grid;gap:6px;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.twk-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;align-items:center;gap:4px 6px}
.twk-row small{white-space:nowrap;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.twk-row .tacts{grid-column:auto;margin:0;flex-wrap:nowrap}
.twk-row .kgen{grid-column:2 / -1;margin-top:-2px}
.twk-pips{display:inline-flex;flex-wrap:wrap;gap:3px;max-width:150px}
.twp,.tkp{width:13px;height:13px;padding:0;border-radius:3px;border:1.5px solid var(--side-e);background:transparent}
.twp.on{background:var(--side-e)}
.tkp{border-radius:50%;border-color:var(--ki)}
.tkp.on{background:var(--ki)}
.tfeats{display:flex;flex-wrap:wrap;gap:4px}
.tfeat{font-size:12.5px;padding:3px 8px 3px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);display:inline-flex;gap:5px;align-items:center}
.tfeat span{min-width:18px;height:18px;border-radius:50%;background:var(--ki);color:#fff;font-weight:700;font-size:11px;display:inline-grid;place-items:center}
.tfeat[disabled]{opacity:.45}
.tfeat.used{text-decoration:line-through}
.tturn{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.tturn .tend{flex-basis:100%;margin:0}
.tturn div{flex:1;display:grid}
.tturn small{color:var(--muted);font-size:11.5px}
.tturn b{font-family:var(--display);font-size:24px;line-height:1.1}
.tstep{min-width:24px;height:26px;padding:0 4px;border:1px solid var(--line);border-radius:8px;background:var(--raised);font-weight:700;line-height:1}
.tstep[disabled]{opacity:.4}
.tscore{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;align-items:center}
.tscore>small{text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.tscore-n{font-weight:700;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--side-f);padding-left:6px}
.tscore-n.E{border-left-color:var(--side-e)}
.tscore-v{display:flex;align-items:center;gap:2px}
.tscore-v b{min-width:22px;text-align:center;font-size:18px;font-family:var(--display)}
.tlast{font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--shu);vertical-align:middle}
.troll{border:1px dashed var(--line);border-radius:8px;padding:6px 8px}
.troll p{margin:0 0 4px}
.tgame .tvp li.now{font-weight:700;color:var(--accent)}
.tgame .tvp li.past{color:var(--muted);text-decoration:line-through}
.tlos h5{margin:8px 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tlos ul{margin:0;padding-left:16px;display:grid;gap:2px}
.tinfo .tacts{margin:6px 0}
.tthemes{display:grid;gap:4px;font-size:13px;margin-bottom:6px}
label.inline{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.tlegend{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.tlegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tsetup{max-width:560px}
.tform{display:grid;gap:12px}
.tform label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.tform select{font-size:15px;padding:8px 10px;color:var(--ink)}
.tform .fixed{font-weight:500;color:var(--ink);font-size:15px}
.tdice{align-items:center}

/* SVG board: sumi-e on rice paper */
#tSvg .felt{fill:none}
#tSvg .g1{stroke:var(--g1);stroke-width:.025}
#tSvg .g6{stroke:var(--g6);stroke-width:.04;stroke-dasharray:.3 .18}
#tSvg .dz{opacity:.2}
#tSvg .dedge{opacity:.85}
#tSvg .nedge{opacity:.75}
#tSvg .mount{fill:var(--mount)}
#tSvg .mount-line{fill:none;stroke:var(--mount-line);stroke-width:.035;opacity:.8}
#tSvg .seal rect{fill:var(--shu)}
#tSvg .seal text{font:800 .36px var(--display);fill:#f6efe2;text-anchor:middle;dominant-baseline:middle}
#tSvg .zone{cursor:pointer}
#tSvg .zwash{opacity:.2}
#tSvg .zrim{fill:none;stroke:var(--sumi);stroke-width:.06;stroke-dasharray:.45 .2;opacity:.55}
#tSvg .zone.sel .zrim{stroke:var(--accent);stroke-width:.12;opacity:1}
#tSvg .terr{cursor:move}
#tSvg .ink-solid{fill:var(--sumi);opacity:.82}
#tSvg .ink-fine{fill:none;stroke:var(--sumi);stroke-width:.035;stroke-linecap:round;opacity:.6}
#tSvg .ink-dot{fill:var(--sumi);opacity:.55}
#tSvg .ink-deep{fill:var(--sumi);opacity:.7}
#tSvg .moss{fill:var(--t-wood);opacity:.8}
#tSvg .petal{fill:var(--petal);opacity:.85}
#tSvg .koi{fill:#d4683a;opacity:.85}
#tSvg .koi.w{fill:var(--paper-hi)}
#tSvg .shu-dot{fill:var(--shu)}
#tSvg .rope{fill:none;stroke:var(--sumi);stroke-width:.03;opacity:.6}
#tSvg .rim{fill:none;stroke:var(--sumi);stroke-width:.07;opacity:.75}
#tSvg .rim.soft{stroke-width:.045;stroke-dasharray:.35 .15;opacity:.5}
#tSvg .terr .edge{fill:none;stroke:none;pointer-events:none}
#tSvg .terr.sel .edge{stroke:var(--accent);stroke-width:.12}
#tSvg .terr.bad .edge{stroke:var(--fire);stroke-width:.12;stroke-dasharray:.3 .2}
#tSvg .tlabel{font:700 .4px var(--display);fill:var(--sumi);text-anchor:middle;dominant-baseline:middle;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:.12;stroke-linejoin:round}
#tSvg .obj{cursor:pointer}
#tSvg .obj-wash{opacity:.55}
#tSvg .obj.sel .ink-solid{fill:var(--accent);opacity:1}
#tSvg .tok{cursor:grab}
#tSvg .tok .base{fill:var(--paper-hi);stroke:none}
#tSvg .tok .arc{opacity:.32}
#tSvg .tok.F .arc,#tSvg .tok.F .ring{fill:var(--side-f)}
#tSvg .tok.E .arc,#tSvg .tok.E .ring{fill:var(--side-e)}
#tSvg .tok .face{stroke:var(--sumi);stroke-width:.07;stroke-linecap:round}
#tSvg .tok .ini{font-family:var(--display);font-weight:800;fill:var(--sumi);text-anchor:middle;pointer-events:none}
#tSvg .tok.sel .ring{fill:var(--accent)}
#tSvg .tok.bad .base{stroke:var(--fire);stroke-width:.08;stroke-dasharray:.18 .12}
#tSvg .btb{fill:var(--sumi);pointer-events:none}
#tSvg .btb.foe rect{fill:var(--shu);stroke:var(--paper);stroke-width:.03}
.btb-foe{color:var(--side-e);font-weight:700}
#tSvg .tstate{font:700 .26px var(--body);fill:var(--shu);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:.08}
#tSvg .los-face{stroke:var(--sumi);stroke-width:.04;stroke-dasharray:.25 .15;opacity:.45;pointer-events:none}
#tSvg .los-line{stroke:var(--sumi);stroke-width:.025;opacity:.45;pointer-events:none}
#tSvg .los-no{stroke:var(--shu);stroke-width:.06;stroke-dasharray:.2 .15;pointer-events:none}
#tSvg .los-ring{fill:none;stroke:var(--sumi);stroke-width:.07;pointer-events:none}
#tSvg .los-ring.cover{stroke-dasharray:.18 .12}
#tSvg .actdot{fill:none;stroke:var(--sumi);stroke-width:.025;opacity:.55;pointer-events:none}
#tSvg .actdot.on{fill:var(--sumi);opacity:.85}
#tSvg .tok.exh .base{fill:var(--paper);opacity:.55}
#tSvg .tok.exh .ini{opacity:.45}
#tSvg .warc{fill:none;stroke:var(--shu);stroke-width:.07;stroke-linecap:round;pointer-events:none}
#tSvg .vimring{fill:none;stroke:var(--accent);stroke-width:.07;stroke-dasharray:.1 .08}
#tSvg .handle{fill:var(--accent);stroke:var(--paper);stroke-width:.05;cursor:grab}
#tSvg .hline,#tSvg .rel,#tSvg .trail,#tSvg .ruler,#tSvg .dlabel,#tSvg .tstate{font:700 .26px var(--body);fill:var(--shu);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:.08}
#tSvg .los-face{stroke:var(--sumi);stroke-width:.04;stroke-dasharray:.25 .15;opacity:.45;pointer-events:none}
#tSvg .los-line{stroke:var(--sumi);stroke-width:.025;opacity:.45;pointer-events:none}
#tSvg .los-no{stroke:var(--shu);stroke-width:.06;stroke-dasharray:.2 .15;pointer-events:none}
#tSvg .los-ring{fill:none;stroke:var(--sumi);stroke-width:.07;pointer-events:none}
#tSvg .los-ring.cover{stroke-dasharray:.18 .12}
#tSvg .actdot{fill:none;stroke:var(--sumi);stroke-width:.025;opacity:.55;pointer-events:none}
#tSvg .actdot.on{fill:var(--sumi);opacity:.85}
#tSvg .tok.exh .base{fill:var(--paper);opacity:.55}
#tSvg .tok.exh .ini{opacity:.45}
#tSvg .warc{fill:none;stroke:var(--shu);stroke-width:.07;stroke-linecap:round;pointer-events:none}
#tSvg .vimring{pointer-events:none}
#tSvg .hline{stroke:var(--accent);stroke-width:.05;stroke-dasharray:.12 .1}
#tSvg .rel{stroke:var(--shu);stroke-width:.06;stroke-dasharray:.2 .12}
#tSvg .trail{stroke:var(--sumi);stroke-width:.05;stroke-dasharray:.15 .1;opacity:.6}
#tSvg .ruler{stroke:var(--shu);stroke-width:.08;stroke-linecap:round}
#tSvg .dlabel{font:800 .6px var(--display);fill:var(--sumi);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:.14}

@media (max-width:1100px){
  .tgrid{grid-template-columns:minmax(0,1fr)}
  .tboard{position:static;order:-1}
  .tside.right{max-height:none}
  #tSvg{max-height:none}
}

/* ---------- Testing lists ---------- */
#testView{padding-block:10px 0}
.xnew{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.xpick{display:flex;flex-wrap:wrap;align-items:end;gap:8px}
.xpick label:first-child{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted);flex:1 1 220px}
.xpick select{font:inherit;font-size:15px;padding:8px 10px;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:8px}
.xgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.xside{display:grid;gap:10px;min-width:0}
.xside-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--side-f);position:sticky;top:0;z-index:2}
.xside.E .xside-h{border-top-color:var(--side-e)}
.xside-h b{font-family:var(--display);font-size:20px}
.xside-h span{color:var(--muted);font-size:13px}
.xstat{margin:6px 0}
.xstat b{font-size:14px}
.xtraits{margin:6px 0 0;font-size:13px;color:var(--muted)}
/* Two columns: the page fills the screen and each side scrolls on its own */
body.test-mode{padding-bottom:0}
body.test-mode #testView{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-bottom:8px}
body.test-mode #testView>.thead,body.test-mode #testView>.note{flex:none}
body.test-mode .xgrid{flex:1;min-height:0}
body.test-mode .xside{height:100%;overflow-y:auto;overscroll-behavior:contain;align-content:start;padding-bottom:16px;scrollbar-width:thin}
/* Two columns in landscape (phone, tablet) and on any wide screen; one column only on a narrow portrait screen */
@media (max-width:900px) and (orientation:portrait){
  .xgrid{grid-template-columns:minmax(0,1fr)}
  body.test-mode #testView{display:block;height:auto}
  body.test-mode .xside{height:auto;overflow:visible}
}
@media (orientation:landscape) and (max-height:500px){ body.test-mode #testView>.note{display:none} }
/* Landscape phones: tighter cards so two columns fit */
@media (orientation:landscape) and (max-width:950px){
  #testView .xgrid{gap:8px}
  #testView .m{padding:10px}
  #testView .m-name{font-size:17px}
  #testView .xside-h b{font-size:16px}
  #testView .xside-h span{font-size:12px}
  #testView .statline{gap:3px}
  #testView .statline div{padding:3px 1px}
  #testView .statline b{font-size:12.5px}
  #testView .statline small{font-size:9px;letter-spacing:.04em}
  #testView .track{gap:6px}
  #testView .track-label{font-size:10px}
  #testView .pip{width:20px;height:20px}
  #testView .feat{font-size:12px}
  #testView .xtraits{font-size:12px}
}
.pill.xwhere{color:var(--muted);margin-right:6px}
.pill.xwhere.table{color:var(--ok,var(--ink))}

/* ---------- Opposed dice tool ---------- */
#diceHost{position:fixed;top:70px;right:16px;z-index:60;width:min(440px,calc(100vw - 16px));max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.35)}

#diceHost .dhead{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:grab;border-bottom:1px solid var(--line);touch-action:none;user-select:none}

#diceHost .dbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}

#diceHost .dseg button:last-of-type{border-radius:0 6px 6px 0}

#diceHost .dcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#diceHost .dside{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--raised)}
#diceHost .dside.F{border-top:3px solid var(--side-f)}
#diceHost .dside.E{border-top:3px solid var(--side-e)}
#diceHost .dside h4{margin:0 0 6px;font-size:.9rem}
#diceHost .dtag{font-size:.65rem;padding:1px 6px}
#diceHost .dpool{margin-bottom:8px}
#diceHost .dpool-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:.8rem}
#diceHost .dstep{display:inline-flex;align-items:center;gap:2px}
#diceHost .dstep small{color:var(--muted);margin-right:2px}
#diceHost .dstep button,#diceHost .dsmall{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;min-width:26px;height:26px;font:inherit;font-size:.8rem;cursor:pointer;padding:0 6px}
#diceHost .dstep .num{min-width:1.4em;text-align:center}
#diceHost .dice{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;min-height:44px;align-items:center}
#diceHost .diewrap{position:relative;display:inline-block}
#diceHost .die{width:42px;height:42px;border-radius:9px;border:2px solid var(--line);background:#f6f1e4;color:#1b1b1b;font:700 1.35rem/1 inherit;cursor:pointer}
#diceHost .die.blank{background:var(--surface);color:var(--muted);border-style:dashed}
#diceHost .die.one{opacity:.4}
#diceHost .die.off{opacity:.3;text-decoration:line-through}
#diceHost .die.hi{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#diceHost .die.sup{border-color:var(--ki)}
#diceHost .die.again::after{content:"↻";position:absolute;left:3px;bottom:1px;font-size:.6rem;color:#555}
#diceHost .diex{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.7rem;line-height:1;padding:0;cursor:pointer}
#diceHost .diex.on{background:var(--harm);color:#fff}
#diceHost .die.roll{animation:dieroll .35s ease-out}
@keyframes dieroll{0%{transform:rotate(-40deg) scale(.7)}60%{transform:rotate(15deg) scale(1.12)}100%{transform:none}}
#diceHost .dres{font-size:.78rem;color:var(--muted)}
#diceHost .dres.zero{opacity:.7}
#diceHost .dnone{font-size:.8rem}
#diceHost .dresult{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:.85rem}
#diceHost .dresult h4{margin:0 0 4px}
#diceHost .dresult p{margin:0 0 6px}
#diceHost .dhit{color:var(--harm)}
#diceHost .dheld{color:var(--ki)}
#diceHost .dnote{font-size:.72rem}
@media (max-width:520px){#diceHost .dcols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#diceHost .die.roll{animation:none}}

<body>


<div id="homeView" class="screen" hidden></div>
<div id="endView" class="screen" hidden></div>
<div id="tableView" hidden></div>
<div id="testView" hidden></div>
<div id="diceHost" hidden></div>

<div id="playView">
<div class="bar">
  <div class="bar-top">
    <div class="turn"><button class="list-btn home-btn" id="listBtn" aria-label="Home"><small id="listName">Risen Sun</small></button><span id="turnLabel">Deployment</span></div>
  </div>
  <div class="bar-row">
    <div class="score"><b>VP</b><button class="step" data-score="vp" data-d="-1" aria-label="Remove VP">−</button><span class="v num" id="vp">0</span><button class="step" data-score="vp" data-d="1" aria-label="Add VP">+</button></div>
    <div class="score"><b>SP</b><button class="step" data-score="sp" data-d="-1" aria-label="Remove SP">−</button><span class="v num" id="sp">0</span><button class="step" data-score="sp" data-d="1" aria-label="Add SP">+</button></div>
    <button class="icon-btn" id="restart" aria-label="Restart at Deployment"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></button>
    <button class="icon-btn undo-btn" id="undo" aria-label="Undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Undo</span></button>
  </div>
  <div class="bar-foot">
    <div class="phases" id="phases"></div>
    <button class="next" id="next">Start turn 1</button>
  </div>
</div>

<div class="reminders" id="reminders"></div>

<div class="play-actions">
  <button class="btn" id="goHome">Home</button>
  <span class="spacer"></span>
  <button class="btn" id="abandonGame">Abandon game</button>
  <button class="btn primary" id="endGame">End game</button>
</div>
</div>

  <button class="btn" id="syncBtn" hidden>Sync <span class="sync-status" id="syncStatus" data-kind="off">Off</span></button>
  <button class="btn" id="themeBtn">Light / dark</button>
</div>

<div id="sheetHost"></div>
<div id="toastHost"></div>


<script>window.APP_BUILD = true;</script>
<script>
/* Bushido newrecruit PDF parser. Input: pages = [{items:[{s,x,y,w,h}]}] with y measured from page top. */
const BP = (() => {
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’‘]/g, "'").replace(/\s+/g, " ").trim().toLowerCase();

  // Merge fragments split by ligatures ("Pro"+"fi"+"le") into cells
  function cells(items) {
    const its = items.filter(i => i.s && i.s.trim()).map(i => ({ s: i.s, x0: i.x, x1: i.x + i.w, y: i.y, h: i.h }))
      .sort((a, b) => Math.abs(a.y - b.y) < 0.8 ? a.x0 - b.x0 : a.y - b.y);
    const out = [];
    for (const it of its) {
      const last = out[out.length - 1];
      if (last && Math.abs(last.y - it.y) < 0.8 && it.x0 - last.x1 < 1.5 && it.x0 >= last.x0) { last.s += it.s; last.x1 = it.x1; }
      else out.push({ ...it });
    }
    out.forEach(c => c.s = c.s.replace(/\s+/g, " ").trim());
    return out;
  }

  const HEAD_WORDS = { "character profile": "Melee Pool", "models": "Options", "melee weapon": "Melee Weapon Strength",
    "ranged weapon": "Ranged Weapon Strength", "ki feat": "Cost", "character traits": "Traits", "unique effects": "Description",
    "special card": null };
  function headerKind(c, line) {
    if (c.x0 > 14) return null;
    const n = norm(c.s);
    let kind = Object.keys(HEAD_WORDS).find(k => n === k || (k === "special card" && n.startsWith("special card")));
    if (!kind) return null;
    const others = line.filter(o => o !== c);
    if (!others.length) return null;
    if (kind === "special card") {
      const first = norm(others[0].s);
      if (!["description", "melee weapon strength", "ranged weapon strength", "base"].includes(first)) return null;
      return n === "special card" ? "special" : n.includes("melee") ? "special-melee" : n.includes("ranged") ? "special-ranged" : n.includes("terrain") ? "special-terrain" : "special";
    }
    if (!others.some(o => norm(o.s) === norm(HEAD_WORDS[kind]))) return null;
    return kind;
  }

  // Split a page into blocks: each a header line + the cells beneath it
  function blocks(cs) {
    const byLine = new Map();
    cs.forEach(c => { const k = Math.round(c.y * 2) / 2; (byLine.get(k) || byLine.set(k, []).get(k)).push(c); });
    const heads = [];
    for (const [y, line] of byLine) for (const c of line) { const k = headerKind(c, line); if (k) heads.push({ kind: k, y: c.y, cols: line.slice().sort((a, b) => a.x0 - b.x0) }); }
    heads.sort((a, b) => a.y - b.y);
    // end markers: Rules / Categories footers
    const stops = cs.filter(c => c.x0 > 9 && c.x0 < 14 && /^(Rules|Categories)\b/.test(c.s)).map(c => c.y);
    return heads.map((h, i) => {
      const next = Math.min(heads[i + 1] ? heads[i + 1].y : 1e9, ...stops.filter(y => y > h.y));
      const stopY = stops.filter(y => y > h.y).length ? Math.min(...stops.filter(y => y > h.y)) - 5 : 1e9;
      const body = cs.filter(c => c.y > h.y + 1 && c.y < Math.min(heads[i + 1] ? heads[i + 1].y - 1 : 1e9, stopY) && !h.cols.includes(c));
      return { ...h, rows: rowsOf(h, body) };
    });
  }

  function rowsOf(h, body) {
    const cols = h.cols.map(c => ({ name: c.s, x0: c.x0 }));
    const colOf = c => { let best = 0; cols.forEach((k, i) => { if (k.x0 <= c.x0 + 3) best = i; }); return best; };
    const anchors = body.filter(c => colOf(c) === 0).sort((a, b) => a.y - b.y);
    const groups = [];
    for (const a of anchors) { const g = groups[groups.length - 1]; if (g && a.y - g[g.length - 1].y < 14) g.push(a); else groups.push([a]); }
    let rows = groups.map(g => ({ y: g.reduce((s, c) => s + c.y, 0) / g.length, cells: [] }));
    if (!rows.length) rows = [{ y: 0, cells: [] }];
    body.forEach(c => { let r = rows[0]; rows.forEach(x => { if (Math.abs(x.y - c.y) < Math.abs(r.y - c.y)) r = x; }); r.cells.push(c); });
    return rows.map(r => {
      const o = {};
      cols.forEach((k, i) => { o[k.name] = r.cells.filter(c => colOf(c) === i).sort((a, b) => a.y - b.y || a.x0 - b.x0).map(c => c.s).join(" ").replace(/\s+/g, " ").trim(); });
      o._first = o[cols[0].name];
      return o;
    });
  }

  // Split on commas outside brackets/parentheses
  function splitTop(s) {
    const out = []; let depth = 0, cur = "";
    for (const ch of s || "") { if ("[(".includes(ch)) depth++; if ("])".includes(ch)) depth--; if (ch === "," && depth <= 0) { out.push(cur.trim()); cur = ""; } else cur += ch; }
    if (cur.trim()) out.push(cur.trim());
    return out;
  }

  const IMMUNE_MAP = { fire: "On Fire", "on fire": "On Fire", poison: "Poisoned", poisoned: "Poisoned", bleed: "Bleed", control: "Controlled", controlled: "Controlled" };
  const STATE_NAMES = ["Aggressive", "Bleed", "Blind", "Controlled", "Cowardly", "Death Sentence", "Diseased", "Disguised", "Frightened", "Held", "Immobilised", "Impetuous", "On Fire", "Poisoned", "Prone", "Reloading", "Run", "Spirit Block", "Stunned", "Virtue"];
  function immunities(traits) {
    const set = new Set();
    const m = traits.match(/Immune\s*\[([^\]]+)\]/i);
    if (m) m[1].split(",").forEach(x => { const k = x.trim().toLowerCase(); const st = IMMUNE_MAP[k] || STATE_NAMES.find(s => s.toLowerCase() === k); if (st) set.add(st); });
    if (/\bFearless\b/.test(traits)) set.add("Frightened");
    if (/\bSoulless\b/.test(traits)) ["Bleed", "Frightened", "Poisoned"].forEach(x => set.add(x));
    if (/\bImmovable\b/.test(traits)) set.add("Prone");
    return [...set];
  }
  const num = s => { const m = String(s || "").match(/-?\d+/); return m ? +m[0] : null; };

  function parseCardPage(title, rice, bl, roleHint) {
    const profiles = [], weapons = [], feats = [], notes = [], equip = [], traitsArr = [];
    let cardText = [];
    for (const b of bl) {
      for (const r of b.rows) {
        const g = k => r[k] || "";
        if (b.kind === "character profile" && r._first) {
          profiles.push({ name: r._first, mp: g("Melee Pool"), mb: g("Melee Boost"), rp: g("Ranged Pool"), rb: g("Ranged Boost"), mv: g("Move"), mvb: g("Move Boost"),
            ki: num(g("Ki")) ?? 0, kib: g("Ki Boost"), kic: num(g("Ki Cap")) ?? 0, w: num(g("Wounds")) ?? 1, size: g("Size & Base") });
        } else if (b.kind === "character traits" && g("Traits")) traitsArr.push(g("Traits"));
        else if ((b.kind === "melee weapon" || b.kind === "special-melee") && r._first)
          weapons.push({ n: r._first, s: g("Melee Weapon Strength"), t: [g("Traits"), g("Specials"), g("Unique Effects")].filter(Boolean).join(", "), eq: b.kind === "special-melee" });
        else if ((b.kind === "ranged weapon" || b.kind === "special-ranged") && r._first)
          weapons.push({ n: r._first, s: g("Ranged Weapon Strength"), range: g("Range Bands"), t: [g("Traits"), g("Specials"), g("Unique Effects")].filter(Boolean).join(", "), eq: b.kind === "special-ranged" });
        else if (b.kind === "ki feat" && r._first) {
          const lim = g("Limitation");
          feats.push({ n: r._first, c: num(g("Cost")) ?? 0, tm: g("Timing"), sub: g("Subject"), lim: /\bOpG\b|On(c)?e Per Game/i.test(lim) ? "OpG" : /\bOpT\b|On(c)?e Per Turn/i.test(lim) ? "OpT" : "", limText: lim, d: g("Description") });
        } else if (b.kind === "unique effects" && g("Description")) notes.push({ n: r._first, d: g("Description") });
        else if (b.kind === "special" && g("Description")) { equip.push({ n: r._first, d: g("Description") }); cardText.push(g("Description")); }
        else if (b.kind === "special-terrain") { const { _first, ...rest } = r; cardText.push(Object.entries(rest).filter(([k, v]) => v && k !== Object.keys(rest)[0]).map(([k, v]) => k === "Description" ? v : `${k}: ${v}`).join(". ")); }
      }
    }
    if (profiles.length) {
      const traits = traitsArr.join(", ");
      const allText = notes.map(n => n.d).join(" ");
      const models = profiles.map(p => {
        let name = p.name;
        if (profiles.length === 1 && norm(p.name).startsWith(norm(title))) name = title;
        return { name, card: title, rice, stats: p, w: p.w, kiGen: p.ki, kiCap: Math.max(p.kic, 0), traits, weapons, feats, notes,
          immune: immunities(traits), zeroKiSlow: /zero Ki Tokens?,? it has Slow/i.test(allText), intimidate: /\bIntimidate\b/.test(traits),
          group: /\bGroup\b/.test(traits) };
      });
      return { kind: "profile", title, rice, models, equip };
    }
    return { kind: "card", title, rice, text: cardText.join(" ") };
  }

  function parseGlossary(pages) {
    const g = {};
    for (const cs of pages) {
      let term = null;
      for (const c of cs) {
        if (c.x0 < 7 && /:$/.test(c.s) && c.s.length < 40 && c.h > 10.5) { term = c.s.replace(/\s*:$/, "").trim(); g[term] = ""; }
        else if (term && c.h < 10.5) g[term] = (g[term] + " " + c.s).trim();
      }
    }
    return g;
  }

  function parse(pages) {
    const pc = pages.map(p => cells(p.items));
    // Roster page
    const first = pc[0];
    const titleCell = first.find(c => c.y < 15);
    const listName = titleCell ? titleCell.s.replace(/\[\s*\d+\s*Rice\]/i, "").trim() : "Imported list";
    const sub = first.find(c => c.y > 15 && c.y < 35);
    const hdr = first.find(c => c.s === "NAME");
    const roleX = (first.find(c => c.s === "ROLE") || {}).x0 || 100, optX = (first.find(c => c.s === "OPTIONS") || {}).x0 || 200;
    const roster = [];
    if (hdr) {
      const rows = new Map();
      first.filter(c => c.y > hdr.y + 2).forEach(c => { const k = Math.round(c.y); (rows.get(k) || rows.set(k, []).get(k)).push(c); });
      for (const [, line] of [...rows].sort((a, b) => a[0] - b[0])) {
        let name = "", role = "", opts = "";
        line.forEach(c => { if (c.x0 >= optX - 6) opts += " " + c.s; else if (c.x0 >= roleX - 6) role += " " + c.s; else name += " " + c.s; });
        name = name.trim(); role = role.trim();
        if (!role) { const m = name.match(/^(.*?)\s+((?:Faction|Ronin)\s+\w+\s+Cards)$/); if (m) { name = m[1]; role = m[2]; } }
        if (name) roster.push({ name, role, options: splitTop(opts.trim()) });
      }
    }
    // Card pages
    const cards = []; const glossPages = [];
    let inRules = false;
    pc.slice(1).forEach(cs => {
      if (cs.some(c => c.s === "Rules" && c.y < 20 && c.h > 14)) inRules = true;
      if (inRules) { glossPages.push(cs); return; }
      const banner = cs.filter(c => c.y < 13);
      if (!banner.length) return;
      const riceC = banner.find(c => /^-?\d+\s*RICE$/i.test(c.s));
      const titleC = banner.find(c => c !== riceC);
      if (!titleC) return;
      const rosterEntry = roster.find(r => norm(r.name).toUpperCase() === norm(titleC.s).toUpperCase() || norm(r.name) === norm(titleC.s));
      const title = rosterEntry ? rosterEntry.name : titleC.s;
      cards.push({ ...parseCardPage(title, riceC ? num(riceC.s) : 0, blocks(cs)), role: rosterEntry ? rosterEntry.role : "", options: rosterEntry ? rosterEntry.options : [] });
    });
    return { name: listName, subtitle: sub ? sub.s : "", roster, cards, glossary: parseGlossary(glossPages) };
  }

  const typeOf = role => /event/i.test(role) ? "Event" : /theme/i.test(role) ? "Theme" : /terrain/i.test(role) ? "Terrain" : /enhancement/i.test(role) ? "Enhancement" : /curse/i.test(role) ? "Curse" : "Card";

coin":{"n":"Hotai's Coin","d":"Attached model can re-roll 1s rolled for a test, once per test. If any of the re-rolled dice is a 1, discard this card."},"arashi's fan":{"n":"Arashi's Fan","d":"Attached model gains Ranged Defence (+2)."},"the kiyozumi katana":{"n":"The Kiyozumi Katana","weapon":{"n":"The Kiyozumi Katana","s":"+1","t":"Vengeance [Non-Samurai], Counterstrike Defence (1)","eq":true}},"ataka archery cap":{"n":"Ataka Archery Cap","d":"Attached model gains Courage (1), and its Dai Kyu Ranged Weapon gains Lightweight. Requirement [Inoue Kikuko]"},"western riding hat":{"n":"Western Riding Hat","d":"Attached model gains Charging Bonus [Fear(5)], Courage (1), and Ranged Defence (2). Requirement [Ōiwa Yoshitaka]"},"horse leather helmet":{"n":"Horse-Leather Helmet","d":"Attached model gains Charging Bonus [Fear(5)], Ranged Defence (2), and Resistance (1). Requirement [Taka Toshiyuki]"},"equestrian leg yield":{"n":"Equestrian Leg Yield","d":"During an Enemy model's activation in which it entered into BtB with, or Targets the Attached Friendly Samurai model with a Ranged Attack or Ki Feat, but before any Melee Exchange begins; make an Opposed Move Test. If successful, place the Attached model within 2\" of its current location, the Enemy model's action is then considered resolved. Discard this Card. This is a Trap Effect. Requirement [Samurai]"},"sangi crown":{"n":"Sangi Crown","d":"Attached model gains Charging Bonus [Fear(6)], and Ranged Defence (2). Requirement [Takeda Reiko]"},"flying changes":{"n":"Flying Changes","d":"Attached model gains the following Ki Feat: Agility.","feat":{"n":"Agility","c":1,"tm":"Instant","sub":"Personal","lim":"OpT","limText":"OpT","d":"After making a Scenario Action, this model gains an Activation Counter."}},"horse-leather helmet":{"n":"Horse-Leather Helmet","d":"Attached model gains Charging Bonus [Fear(5)], Ranged Defence (2), and Resistance (1). Requirement [Taka Toshiyuki]"},"the high crest":{"n":"The High Crest","d":"Attached model gains Courage (1), and Ranged Defence (2). Requirement [Watanabe Yuka]"},"yeti horns":{"n":"Yeti Horns","d":"Attached model gains Charging Bonus [Fear(5)], Courage (1), and Ranged Defence (2). Requirement [Kazuma Tomoto]"}},"glossary":{"Armour":"Reduce the result of Damage Rolls made against this model by X.","Bleed":"Each time this model inflicts wounds through a Melee Exchange or Ranged Attack to a Non-Soulless Enemy model, that model gains X number of Bleed markers with value Y. If a model has multiple sources of bleed traits, it may only use one at any given time.","Bodyguard":"If an Enemy model declares an action that would move it into BtB with a [Descriptor] Friendly model, or Targets the [Descriptor] Friendly model with a Ranged Attack, this model may switch positions with the Friendly model before the action begins if the following conditions are met: The Friendly model is within X” and in LoS. The Friendly model was not in BtB with an Enemy model at the start of the activation. This model is not in BtB with an Enemy model. This model is not Exhausted or Prone. If the Enemy model has Fear, the bodyguard must pass a fear test. Both models switching positions can fit within the space the other model occupied on the table without moving any other models. If bodyguarding a larger based model, your opponent places the bodyguard anywhere within the area covered by the larger base then you choose facing. The Enemy model’s action is then resolved with this model being declared as the Target. If this model has the Fear trait, the enemy model must make a Fear Test as if this model were its original target. Once the use of the Bodyguard trait by this model is declared, if this model has a Disguised Marker, remove the Disguised Marker immediately.","Bravery":"This model may re-roll a failed Fear Test. It may only re-roll the same Fear Test once due to this trait. If a model with Bravery gains the Cowardly trait, it is considered to have neither trait. If a model with the Bravery trait makes a Fear test against a model with the Terror trait, the effects of both are cancelled.","Brutal":"In a Melee Exchange this model adds X to the result when calculating its final Attack result. This model adds X to the result when calculating its final Ranged Attack result.","Cloudwalk":"When this model moves it ignores Terrain elements, other models, and Zones of Control. It may end its move in an enemy ZoC. This does not allow a model to move out of Melee unless it also has the Agile trait. This model may not end its move occupying the same area as an Impassable Terrain element or another model.","Co-ordinated Attack":"If this model is in a Melee Exchange and one or more Friendly [Descriptor] models is also in BtB with the Enemy model, this model gains +1 Melee Pool bonus.","Combo Attack":"If the Attack is successful then after resolving a Damage Roll, deduct 2 from the Success Level of the Attack. If the new Success Level is 0 or greater make another Damage Roll against the Defender. Repeat this process until the Success Level is less than 0. If the Success Level of the original attack was 0 or 1, after resolving a Damage Roll, make one additional Damage Roll against the Defender at Success Level 0.","Command":"This model may declare a Simple action, Command: The model nominates and activates up to X other non-Exhausted, Friendly [Descriptor] models within Y inches. These models each perform a Standard, Simple action. The order the models activate in is chosen by this model’s Controller after each action is resolved remove an activation counter from the activating model. If a model with the Group trait is chosen you must choose all models on that profile card; if you cannot, then you cannot command any of those models. These are Nested Activations.","Construct":"This model provides cover as if it were terrain.","Counterstrike Defence":"If this Defence is successful, and the Attacker allocated any dice to Attack, then deduct 2 from the Success Level of the Defence. If the Success Level is 0 or greater, then make a Damage Roll against the Attacker using the modified Success Level of the Defence.","Durable":"When this model would suffer more than one wound, it only suffers one wound. This trait is resolved after the Tough trait.","Endurance":"This model suffers no Melee penalty for being Exhausted.","Fearless":"This model automatically succeeds when taking Fear tests and has Immune [Frightened].","Feint":"During Melee Exchanges this model may pick up to X Defence dice rolled by its Opponent to be re- rolled. The same dice may only be re- rolled once due to this model’s trait.","Forceback Attack":"If the Attack is successful, move the Defender 1” directly away from the Attacker, then move the Attacker 1” directly towards the Defender. The Defender suffers half the wounds from the Damage Roll caused by this Attack.","Group":"All models represented by this profile card activate in the same single activation. Each model on this profile card resolves any movement before any Melee Exchanges are resolved. Melee Exchanges are then resolved in the order the Controlling player chooses. These are Nested Activations.","Immovable":"This model may not be Moved or Placed except when making a Disengage, Melee, Run, Walk, or Charge or by using a rule on a Friendly card. This model cannot gain Prone Markers. This model does not rotate at the start of a Melee Exchange, or when performing a Scenario Action.","Immune":"This model may not gain markers of [Descriptor]. If a model gains the Immune trait, immediately remove all markers of [Descriptor].","Impenetrable Defence":"During this model’s Melee Exchanges the Enemy model must remove its highest Attack die rolled before the final Attack result is calculated.","Indomitable":"This model ignores X assisting Enemy models in BtB for penalties during Melee Exchanges.","Intimidate":"During the Starting Phase, this model can Target an enemy model within 8”, Perform an Opposed Ki test with the Targeted model, if this model is successful the Target gains Cowardly, loses Aggressive and cannot Choose or Target this model with a Melee, Charge or Ranged Attack until the End Phase.","Parry":"This model adds X to the Defence result when calculating its final Defence result in Melee Exchanges.","Pierce":"When this model succeeds with an Attack using this weapon, reduce the Enemy model’s Armour trait by X to a minimum of 0.","Powerful Attack":"If the Attack is successful, then the Attacker gains +3 to the Damage Roll caused by this Attack.","Prowess":"During a [Descriptor] Test this model may re- roll up to X of its own dice. It may only re-roll dice once due to this trait. The Descriptors [Attack] and [Defence] refer to Melee Exchanges but are further limited.","Push Attack":"If the Attack is successful, move the Defender directly away from this model until it leaves this model’s ZoC. The Defender does not suffer a Damage Roll from this Attack.","Push Defence":"If the Defence is successful, move the Attacker directly away from the Defender until it leaves the defender’s ZoC.","Ranged Defence":"A model making a Ranged Attack against this model modifies the Challenge Number of the test by X.","Reach":"While using this weapon, it grants this model the Initiative at Step 3 of a Melee Exchange, provided it was not in BtB with its opponent or another Enemy model at the start of the current Activation. If both models in a Melee Exchange would benefit from this Trait, then neither benefits from it.","Reload":"When this model makes a Ranged Attack with this weapon it gains X Reload Markers.","Sidestep Defence":"If the Defence is successful, the Defender leaves BtB and then moves away from the Attacker until the Defender leaves The Attacker's ZoC, at which point its movement ends.","Slow":"This model may not declare Run or Charge actions. During a melee exchange, this model will lose the initiative if it is the active model. If this model has Lightning Reflexes, a weapon with the Reach trait or both then it ignores those traits and Slow for the duration of the melee exchange.","Soulless":"This model automatically succeeds at Fear tests and has Immune [Bleed, Frightened, Poison]. This model also automatically succeeds at Opposed Ki Tests when it is not the Active model.","Sweep Defence":"If the Defence is successful, then the Attacker becomes Prone.","Vengeance":"This model’s melee weapons gain Brutal (+1) and +1 Melee Strength when resolving a melee exchange against a [Descriptor] Model.","Aloof":"This model may not perform Scenario Actions.","Aware":"This model’s LoS extends 360 degrees around its base.","Cowardly":"This model must re-roll successful Fear tests. It must only re- roll the same Fear test once due to this trait. If a model with Cowardly gains the Bravery trait it is considered to have neither trait.","Flank":"When this model would be Deployed, this model’s Controller must choose whether this model will use Flank or not. If the player chooses not to use Flank, this model is Deployed as normal. If the player decides the model is using Flank, then the model is left Elsewhere and instead before the game the owning player makes a note of which turn the Flanking models will arrive and notes a neutral table edge. This is Hidden Information. This must be turn 2, 3, or 4. In the Starting Phase of that turn reveal the number and deploy the models anywhere along the chosen edge but not in the Opponent’s Deployment Zone. If a model gains Flank mid game or is removed and returns to play using the Flank rules, you immediately note any turn after the current turn (not just 2, 3, or 4) and a neutral edge for that model when it is removed from play. This is Hidden Information. Flanking models generate two Activation Counters when they are Deployed.","Insignificant":"This model: Has a ZoC that may be ignored at all times. Cannot apply Melee assist Modifiers. May not perform Simple Scenario or Complex Scenario actions.","Sharp":"This model reduces the enemy model’s Tough trait by X, to a minimum of 0, when it succeeds with an Attack with this weapon.","Sidestep Attack":"If the Attack is successful, the Attacker leaves BtB and then moves away from the Defender until the Attacker leaves The Defender's ZoC, at which point its movement ends. The Attacker makes no damage roll.","Strategy":"Whenever you win the Tactical Roll, this model gains the bracketed bonus.","Tactician":"This model adds X dice when it performs Tactical Tests.","Tiny":"This model is Tiny sized. Models Targeting this model with a Ranged Attack add a +1 modifier to the Challenge Number of the test. This model rolls one die for Size Tests.","Tough":"When this model would suffer Wounds from any source reduce the final number of Wounds by X (If X is negative, instead you will increase the number of wounds taken).","Willpower":"This model modifies the result by X when calculating its final result in Opposed Ki tests when it is the Activating model.","Charging Bonus":"When this model makes a Charge action it gains the bracketed Bonus until the end of its current activation. If the bonus is a Weapon Trait, then it applies to all valid weapons. This trait may also be a weapon trait if so the bonus only applies when choosing this weapon.","Courage":"When making a Fear Test, modify the result by X.","Dread":"Models making a fear test against this model reduce their Ki statistic by X. This cannot reduce the number of dice rolled below 1 die. Enemy models with Fear values equal to or higher than this model’s fear value do not automatically pass their fear tests against this model.","Fear":"When a model makes a Fear test against this model X is the Challenge Number for the test. Models automatically pass Fear tests with a Challenge Number equal to or lower than their Fear (X) trait, but must still take a Fear test if the Challenge Number is higher than their Fear (X) trait.","Intangible":"This model ignores Zones of Control, other models and Terrain elements during movement and being in BtB when declaring actions; it may move out of BtB freely. It may not end its move occupying the same area as an Impassable Terrain element or another model. This model also has Immune [Held, Immobilised].","Lightweight":"This model does not suffer the modifier for moving during a Ranged Attack when using this weapon.","Resistance":"This model modifies the result by X when it participates in an Opposed Ki test and is not the Activating model.","Terror":"If a model makes a Fear test caused by this model it must re-roll the test if it succeeds. Models must only re-roll the same test once due to this trait. If a model with the Bravery trait makes a Fear test caused by this model the effects of both traits are cancelled.","Banzai!":"This model may make a Charge Action as a Standard Simple action, rather than a Complex action.","Cavalry":"Written as Cavalry (X”). Before or after this model performs any action it may Walk X”.","Unstable":"This model treats each inch moved in Difficult Terrain elements as 4” rather than 2”. If a model with this trait gains the Lightfooted Trait, it counts as having neither trait.","Leadership":"Written as Leadership [Descriptor](X/Y”). Whilst within Y” Friendly [Descriptor] models add X to the final Result when taking a Fear Test. If in range of multiple models with Leadership, use only the highest X value.","Impetuous":"Written as Impetuous (X). If this model is on the Battlefield during the Starting Phase, this model gains X Impetuous Markers. While this model has Impetuous Markers, it has the Fearless trait.","Jump Up":"At the start of this model’s activation, but before its action is declared, you may remove any Prone markers from this model.","Fire":"Written as Fire (X/Y). Each time this model inflicts wounds using this weapon, the Enemy model gains X Fire Y markers. If a model has multiple sources of fire traits, it may only use one at any given time.","Slam Attack":"If the Attack is successful, the Defender is moved 3” directly away from the Attacker and becomes Prone. The Defender suffers half the Wounds from the Damage Roll caused by this Attack.","Strong":"This model makes Size tests at +1 Dice. When this model makes a Damage Roll, roll 3D6 and choose the two highest dice. If a model has both Strong and Weak traits, the effects of both are cancelled. This trait may be further modified to specify weapons or Descriptors of weapon, e.g. Strong [Melee].","Unblockable":"Written as Unblockable (X). During this model’s Melee Exchanges the Enemy model must remove its X highest Defence dice rolled before the final Defence result is calculated.","Scout":"Written as Scout (X/Y”). This model may deploy after both player’s normal Deployment and may deploy anywhere within Y” of the Controlling player’s normal Deployment Zone. If a Warband contains one or more models with Scout, the player adds the highest X value to the result of Deployment Tactical Tests. If both players have models with Scout the loser of the Deployment Tactical Test deploys their models with Scout first."}},"lists":[{"name":"Campaign 3","subtitle":"Risen Sun [90 Rice] (The Imperial Court)","roster":[{"name":"Meng Yi","role":"Faction Profile Cards","options":[]},{"name":"Shìbīng","role":"Faction Profile Cards","options":[]},{"name":"Xi","role":"Ronin Profile Cards","options":[]},{"name":"Yanjing","role":"Ronin Profile Cards","options":[]},{"name":"Yizhi","role":"Ronin Profile Cards","options":[]},{"name":"Yūkan'na","role":"Ronin Profile Cards","options":[]},{"name":"Year of the Risen Sun","role":"Ronin Event Cards","options":[]},{"name":"Rice Bale Barricades","role":"Ronin Terrain Cards","options":[]},{"name":"The Imperial March","role":"Ronin Theme Cards","options":[]}],"cards":[{"kind":"profile","title":"Meng Yi","rice":26,"models":[{"name":"Meng Yi","card":"Meng Yi","rice":26,"stats":{"name":"Meng Yi","mp":"4","mb":"2","rp":"0","rb":"","mv":"4","mvb":"","ki":2,"kib":"","kic"
